[package]
name = "pizarra-gpui"
description = "Tu pizarrón virtual de confianza — a free-hand vector drawing app, GPUI frontend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://pizarra.categulario.xyz"
readme = "README.md"
keywords = ["drawing", "whiteboard", "vector", "gpui"]
categories = ["graphics", "gui", "multimedia::images"]
publish = false

[[bin]]
name = "pizarra-gpui"
path = "src/main.rs"

[dependencies]
# The drawing engine: shapes, tools, undo, transforms, SVG (de)serialization.
# Fork with per-segment pressure widths.
pizarra = { git = "https://github.com/moeleak/pizarra", branch = "main" }

# UI. gpui 0.2.2 plus pointer type and pen pressure on mouse events
# (XInput on X11, tablet-unstable-v2 on Wayland).
gpui = { git = "https://github.com/moeleak/zed", branch = "gpui-v0.2.2-tablet" }
# Same lyon gpui uses internally; needed for stroke caps/joins.
lyon = "1.0"
# Offscreen rasterizer used for PNG export (already in gpui's tree via resvg).
tiny-skia = "0.11"

anyhow = "1"
directories = "6"
env_logger = "0.11"
log = "0.4"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
# Keep dependencies fast in debug builds (gpui is slow unoptimized).
opt-level = 2
